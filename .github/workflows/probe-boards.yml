name: Probe job boards
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-boards.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          sleep 30
          for v in scale appen handshake micro1 mercor; do
            d=$(curl -s -m 20 "https://remotegigrai.com/api/jobs?via=$v&sort=pay")
            echo "::notice title=$v::total $(echo "$d" | jq -r '.total') | $(echo "$d" | jq -r '[.items[]|"\(.title) $\(.min//"?")-\(.max//"?") \(.elig//"")"][0:8]|join(" | ")' | cut -c1-1200)"
          done
