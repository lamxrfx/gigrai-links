# One-off: which AI-training companies publish roles in a public job feed (results as annotations).
name: Probe job boards
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-boards.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          RE='AI (Trainer|Tutor|Red Team)|Annotat|Evaluat|Rater|Expert|Specialist|Contract|Freelance|Fellow|Writer|Linguist|Translat|Reviewer|Domain|RLHF|Data Lab'
          for b in alignerr labelbox scaleai outlier invisible invisibletech invisibletechnologies turing surge surgeai surgehq snorkelai snorkel toloka prolific appen welocalize afterquery datacurve abaka sepalai sepal braintrust deccanai deccan rise rex remotasks taskup soulai pareto parsewise turingenterprises micro1 mercor xai anthropic openai cohere perplexity humansignal labelstudio dataannotation g2i revelo andela crossover gloz silencio superannotate imerit cloudfactory lxt telusdigital oneforma centific innodata stellar mindrift handshake; do
            out=""
            a=$(curl -s -m 12 "https://api.ashbyhq.com/posting-api/job-board/$b?includeCompensation=true")
            n=$(echo "$a" | jq -r '.jobs|length' 2>/dev/null)
            if [ -n "$n" ] && [ "$n" != "null" ] && [ "$n" != "0" ]; then
              m=$(echo "$a" | jq -r --arg re "$RE" '[.jobs[]|select(.title|test($re;"i"))]|length'); s=$(echo "$a" | jq -r --arg re "$RE" '[.jobs[]|select(.title|test($re;"i"))|"\(.title) [\(.location)] \(.compensation.compensationTierSummary//"")"][0:6]|join(" | ")' | cut -c1-700)
              out="$out ASHBY $n jobs, $m AI-work: $s"
            fi
            g=$(curl -s -m 12 "https://boards-api.greenhouse.io/v1/boards/$b/jobs")
            n=$(echo "$g" | jq -r '.jobs|length' 2>/dev/null)
            if [ -n "$n" ] && [ "$n" != "null" ] && [ "$n" != "0" ]; then
              m=$(echo "$g" | jq -r --arg re "$RE" '[.jobs[]|select(.title|test($re;"i"))]|length'); s=$(echo "$g" | jq -r --arg re "$RE" '[.jobs[]|select(.title|test($re;"i"))|"\(.title) [\(.location.name)]"][0:6]|join(" | ")' | cut -c1-700)
              out="$out GREENHOUSE $n jobs, $m AI-work: $s"
            fi
            l=$(curl -s -m 12 "https://api.lever.co/v0/postings/$b?mode=json")
            if echo "$l" | jq -e 'type=="array" and length>0' >/dev/null 2>&1; then
              n=$(echo "$l" | jq 'length'); m=$(echo "$l" | jq -r --arg re "$RE" '[.[]|select(.text|test($re;"i"))]|length'); s=$(echo "$l" | jq -r --arg re "$RE" '[.[]|select(.text|test($re;"i"))|"\(.text) [\(.categories.location//"")]"][0:6]|join(" | ")' | cut -c1-700)
              out="$out LEVER $n jobs, $m AI-work: $s"
            fi
            [ -n "$out" ] && echo "::notice title=$b::$out"
          done
          echo done
