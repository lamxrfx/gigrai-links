# Checks which public job-board feeds a company uses (results as annotations). Runs when this file changes.
name: Probe job boards
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-boards.yml"]
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          for b in handshake joinhandshake handshake-ai handshakeai; do
            a=$(curl -s -m 15 "https://api.ashbyhq.com/posting-api/job-board/$b?includeCompensation=true")
            n=$(echo "$a" | jq '.jobs | length' 2>/dev/null); [ -n "$n" ] && [ "$n" != "null" ] && echo "::notice title=Ashby $b::$n jobs. AI-ish: $(echo "$a" | jq -r '[.jobs[] | select(.title|test("AI|Fellow|Tutor|Trainer|PhD|Expert";"i")) | "\(.title) [\(.location)]"] | length') . Sample: $(echo "$a" | jq -r '[.jobs[] | select(.title|test("AI|Fellow|Tutor|Trainer|PhD|Expert";"i")) | "\(.title) [\(.location)] \(.compensation.compensationTierSummary // "")"][0:12] | join(" | ")' | cut -c1-1500)"
            g=$(curl -s -m 15 "https://boards-api.greenhouse.io/v1/boards/$b/jobs")
            n=$(echo "$g" | jq '.jobs | length' 2>/dev/null); [ -n "$n" ] && [ "$n" != "null" ] && echo "::notice title=Greenhouse $b::$n jobs. Sample: $(echo "$g" | jq -r '[.jobs[].title][0:12] | join(" | ")' | cut -c1-1200)"
            l=$(curl -s -m 15 "https://api.lever.co/v0/postings/$b?mode=json")
            n=$(echo "$l" | jq 'length' 2>/dev/null); echo "$l" | jq -e 'type=="array"' >/dev/null 2>&1 && echo "::notice title=Lever $b::$n jobs. Sample: $(echo "$l" | jq -r '[.[].text][0:12] | join(" | ")' | cut -c1-1200)"
          done
          echo done
