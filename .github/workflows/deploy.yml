# Publishes the site to Cloudflare on every push to main (about 1 minute).
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true   # only the newest push gets published

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare key is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish with Wrangler
        working-directory: gigrai-links/gigrai-links
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ebe9e1de0a84e5d863eabdd716f316df
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          # strip stray spaces/line breaks from a pasted key
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if npx --yes wrangler@4.42.0 deploy 2>&1 | tee ../../deploy.log; then
            echo "Published."
          else
            # surface the error as a readable annotation (no secrets are printed by wrangler)
            msg=$(grep -v '^\s*$' ../../deploy.log | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Wrangler deploy failed::${msg}"
            exit 1
          fi

      - name: Copy the report-link secret to Cloudflare
        working-directory: gigrai-links/gigrai-links
        continue-on-error: true   # the site is already live; this only affects private report links
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ebe9e1de0a84e5d863eabdd716f316df
          WRANGLER_SEND_METRICS: "false"
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$REPORT_SECRET" ]; then echo "::notice title=Report links::REPORT_SECRET is not in GitHub secrets yet (skipped)"; exit 0; fi
          # Always copy it, so changing REPORT_SECRET in GitHub (to rotate the private links) takes effect on the next deploy
          if printf '%s' "$REPORT_SECRET" | npx --yes wrangler@4.42.0 secret put REPORT_SECRET >/dev/null 2>&1; then
            echo "::notice title=Report links::REPORT_SECRET copied to Cloudflare"
            sleep 20
            # email the (new) numbers-page link to the GigrAI inbox; it's never printed here
            curl -s -o /dev/null -X POST https://remotegigrai.com/report/email-link || true
          else
            echo "::warning title=Report links::Could not copy REPORT_SECRET to Cloudflare (check the API token can edit Workers)"
          fi
